# Production compose for deployment behind a reverse proxy.
#
# Point your reverse proxy at the frontend port (default 3000). The frontend
# proxies /api/* to the backend internally — do not expose the backend publicly.
#
# Set PUBLIC_ORIGIN to the URL users access the app from, e.g. https://play.example.com

services:
  backend:
    image: tnrd/playtogether-backend:${TAG:-latest}
    expose:
      - "8080"
    environment:
      DATABASE_URL: sqlite:/data/playtogether.db?mode=rwc
      BIND_ADDR: 0.0.0.0:8080
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    image: tnrd/playtogether-frontend:${TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
