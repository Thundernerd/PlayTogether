services:
  backend:
    image: tnrd/squadlist-backend:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite:/data/playtogether.db?mode=rwc
      BIND_ADDR: 0.0.0.0:8080
      # STEAM_API_KEY: your-steam-web-api-key
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    image: tnrd/squadlist-frontend:latest
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
