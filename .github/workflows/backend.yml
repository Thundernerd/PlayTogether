name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the toolchain and components pinned in backend/rust-toolchain.toml.
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # Caches the cargo registry and backend/target, keyed on the toolchain and Cargo.lock.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
