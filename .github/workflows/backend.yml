name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the toolchain and components pinned in backend/rust-toolchain.toml.
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --check
