name: Publish Docker images

# Each platform builds natively on a matching runner (no QEMU), pushes its image
# by digest, and the merge job combines the digests into one multi-arch tag set.
# On main, decide-latest picks whether this run moves `latest` (once, for both
# images), and hand-off-latest gives `latest` to a newer commit that finished
# while this run was pushing. Pull requests build both platforms without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional extra tag to publish (e.g. 1.0.0)
        required: false
        type: string

# The gha build cache and the digest artifacts authenticate with the Actions
# runtime token and Docker Hub with DOCKERHUB_TOKEN, so GITHUB_TOKEN only needs
# to read the repo (checkout).
permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: tnrd
  # Length of the type=sha tag. metadata-action reads it; hand-off-latest uses it
  # to find a commit's sha tag.
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7
  # docker/metadata-action tag rules, shared by both jobs so the per-platform
  # image labels (e.g. org.opencontainers.image.version) match the published tags.
  # `latest` is not in here: only the merge job adds it, and only when the run's
  # commit is still the tip of main (see the decide-latest job).
  IMAGE_TAGS: |
    type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=sha,prefix=

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: tnrd/playtogether-${{ matrix.context }}
    strategy:
      fail-fast: false
      matrix:
        context: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the labels are used here; the merge job applies the tags to the manifest list.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.context }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.context }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs on main finish in any order, so an older commit's run can finish last.
  # Only move `latest` when this run's commit is still the tip of main. The check
  # runs once, after every build leg, and both merge legs use its answer, so
  # backend:latest and frontend:latest always come from the same decision. If the
  # API call fails, skip `latest` rather than failing the run, so the sha tag
  # still gets published.
  decide-latest:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      is-tip: ${{ steps.check.outputs.is-tip }}

    steps:
      - name: Check for tip of main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_tip=false
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Not on main ($GITHUB_REF): not tagging latest."
          elif ! main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha); then
            echo "::warning::Could not look up the tip of main: not tagging latest."
          elif [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "$GITHUB_SHA is the tip of main: tagging latest."
            is_tip=true
          else
            echo "$GITHUB_SHA is behind main ($main_sha): not tagging latest."
          fi
          echo "is-tip=$is_tip" >> "$GITHUB_OUTPUT"

  merge:
    if: github.event_name != 'pull_request'
    needs: [build, decide-latest]
    runs-on: ubuntu-latest
    env:
      IMAGE: tnrd/playtogether-${{ matrix.context }}
    strategy:
      fail-fast: false
      matrix:
        context: [backend, frontend]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.context }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest=false turns off the `latest` that metadata-action would otherwise add
      # on v* tag pushes, so `latest` only ever follows the tip of main. The low
      # priority keeps `version` (and the Inspect step) on the sha, semver or
      # dispatch tag.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            ${{ env.IMAGE_TAGS }}
            type=raw,value=latest,priority=50,enable=${{ needs.decide-latest.outputs.is-tip == 'true' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # decide-latest and the merge push are seconds apart, but a newer commit's whole
  # run could still finish in between, and this run's push would then move
  # `latest` back to an older commit. Re-check once, and if main moved on, point
  # both images' `latest` at the tip's sha tags, or leave both alone when either
  # is missing (the tip's own run hasn't pushed yet and will move `latest`
  # itself). An even newer commit finishing during this hand-off can still lose
  # `latest` to the tip; each step shrinks the window, none closes it.
  hand-off-latest:
    if: needs.decide-latest.outputs.is-tip == 'true'
    needs: [decide-latest, merge]
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Hand latest to a newer tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: tnrd/playtogether-backend tnrd/playtogether-frontend
        run: |
          if ! main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha); then
            echo "::warning::Could not re-check the tip of main: leaving latest on $GITHUB_SHA."
            exit 0
          fi
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "$GITHUB_SHA is still the tip of main."
            exit 0
          fi
          tag=${main_sha:0:$DOCKER_METADATA_SHORT_SHA_LENGTH}
          for image in $IMAGES; do
            if ! docker buildx imagetools inspect "$image:$tag" > /dev/null 2>&1; then
              echo "main moved to $main_sha, but $image:$tag doesn't exist yet: its own run will move latest."
              exit 0
            fi
          done
          echo "main moved to $main_sha while pushing: pointing latest at it."
          for image in $IMAGES; do
            docker buildx imagetools create -t "$image:latest" "$image:$tag"
          done
