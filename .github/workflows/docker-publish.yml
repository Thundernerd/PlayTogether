name: Publish Docker images

# Each platform builds natively on a matching runner (no QEMU), pushes its image
# by digest, and the merge job combines the digests into one multi-arch tag set.
# Pull requests build both platforms without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional extra tag to publish (e.g. 1.0.0)
        required: false
        type: string

# The gha build cache and the digest artifacts authenticate with the Actions
# runtime token and Docker Hub with DOCKERHUB_TOKEN, so GITHUB_TOKEN only needs
# to read the repo (checkout).
permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: tnrd
  # docker/metadata-action tag rules, shared by both jobs so the per-platform
  # image labels (e.g. org.opencontainers.image.version) match the published tags.
  # `latest` is not in here: only the merge job adds it, and only when the run's
  # commit is still the tip of main (see "Check for tip of main").
  IMAGE_TAGS: |
    type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=sha,prefix=

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: tnrd/playtogether-${{ matrix.context }}
    strategy:
      fail-fast: false
      matrix:
        context: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the labels are used here; the merge job applies the tags to the manifest list.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.context }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.context }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: tnrd/playtogether-${{ matrix.context }}
    strategy:
      fail-fast: false
      matrix:
        context: [backend, frontend]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.context }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Runs on main finish in any order, so an older commit's run can finish last.
      # Only move `latest` when this run's commit is still the tip of main;
      # otherwise publish the other tags (sha, semver, dispatch) only. If the API
      # call fails, skip `latest` rather than failing the job, so the sha tag still
      # gets published.
      - name: Check for tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_tip=false
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Not on main ($GITHUB_REF): not tagging latest."
          elif ! tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha); then
            echo "::warning::Could not look up the tip of main: not tagging latest."
          elif [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "$GITHUB_SHA is the tip of main: tagging latest."
            is_tip=true
          else
            echo "$GITHUB_SHA is behind main ($tip): not tagging latest."
          fi
          echo "is-tip=$is_tip" >> "$GITHUB_OUTPUT"

      # latest=false turns off the `latest` that metadata-action would otherwise add
      # on v* tag pushes, so `latest` only ever follows the tip of main. The low
      # priority keeps `version` (and the Inspect step) on the sha, semver or
      # dispatch tag.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            ${{ env.IMAGE_TAGS }}
            type=raw,value=latest,priority=50,enable=${{ steps.tip.outputs.is-tip == 'true' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
